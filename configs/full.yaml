# Higher-resolution, longer-time configuration. Several tens of seconds on
# an Apple M3 Pro laptop (measured; see README Computational performance).
decaying_turbulence:
  N: 256
  nu: 0.005
  dt: 1.0e-3
  t_end: 6.0
  k0: 10.0
  seed: 7
  n_snapshots: 5

# Project 6: POD-Galerkin ROM. Final portfolio-scale results. N=96 (not 256, to keep offline
# SVD/tensor-construction cost reasonable across 4 training trajectories -- see README).
rom:
  training:
    - {label: train1, N: 96, nu: 0.008, dt: 1.0e-3, t_end: 3.0, k0: 8.0, seed: 1, n_snapshots: 250}
    - {label: train2, N: 96, nu: 0.008, dt: 1.0e-3, t_end: 3.0, k0: 8.0, seed: 2, n_snapshots: 250}
    - {label: train3, N: 96, nu: 0.008, dt: 1.0e-3, t_end: 3.0, k0: 8.0, seed: 3, n_snapshots: 250}
    - {label: train4, N: 96, nu: 0.008, dt: 1.0e-3, t_end: 3.0, k0: 8.0, seed: 4, n_snapshots: 250}
  unseen_ic: {label: unseen_ic, N: 96, nu: 0.008, dt: 1.0e-3, t_end: 3.0, k0: 8.0, seed: 123, n_snapshots: 250}
  unseen_nu: {label: unseen_nu, N: 96, nu: 0.016, dt: 1.0e-3, t_end: 3.0, k0: 8.0, seed: 777, n_snapshots: 250}
  # control: SAME phase/seed as train1, only nu changed -- isolates the parameter effect from the
  # phase/IC-randomness effect (see README "Unseen-condition evaluation").
  unseen_nu_same_ic: {label: unseen_nu_same_ic, N: 96, nu: 0.016, dt: 1.0e-3, t_end: 3.0, k0: 8.0, seed: 1, n_snapshots: 250}
  ranks: [4, 8, 16, 32]
  deim_ranks: [8, 16, 32]
  rom_dt: 1.0e-3
  rom_save_every: 5
