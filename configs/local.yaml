# Default laptop-scale configuration for the decaying-2D-turbulence example.
decaying_turbulence:
  N: 128
  nu: 0.01
  dt: 2.0e-3
  t_end: 4.0
  k0: 8.0
  seed: 7
  n_snapshots: 5

# Project 6: POD-Galerkin ROM. Useful development-scale results.
rom:
  training:
    - {label: train1, N: 64, nu: 0.01, dt: 1.0e-3, t_end: 2.0, k0: 7.0, seed: 1, n_snapshots: 150}
    - {label: train2, N: 64, nu: 0.01, dt: 1.0e-3, t_end: 2.0, k0: 7.0, seed: 2, n_snapshots: 150}
    - {label: train3, N: 64, nu: 0.01, dt: 1.0e-3, t_end: 2.0, k0: 7.0, seed: 3, n_snapshots: 150}
  unseen_ic: {label: unseen_ic, N: 64, nu: 0.01, dt: 1.0e-3, t_end: 2.0, k0: 7.0, seed: 42, n_snapshots: 150}
  unseen_nu: {label: unseen_nu, N: 64, nu: 0.02, dt: 1.0e-3, t_end: 2.0, k0: 7.0, seed: 777, n_snapshots: 150}
  # control: SAME phase/seed as train1, only nu changed -- isolates the parameter effect from the
  # phase/IC-randomness effect (see README "Unseen-condition evaluation").
  unseen_nu_same_ic: {label: unseen_nu_same_ic, N: 64, nu: 0.02, dt: 1.0e-3, t_end: 2.0, k0: 7.0, seed: 1, n_snapshots: 150}
  ranks: [4, 8, 16]
  deim_ranks: [8, 16, 24]
  rom_dt: 1.0e-3
  rom_save_every: 5
